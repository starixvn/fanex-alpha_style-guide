<div class="container-login">
    <div class="login-page" ng-controller="sgLoginPage">
        <form class="form-login">
            <div class="rowlg">
                <div class="dropdown">
                    <button class="btn-default dropdown-toggle" type="button" id="dropdownMenu1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
                        <span class="flag flag-en"></span>
                        English
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#"><span class="flag flag-en"></span>English</a></li>
                        <li><a href="#"><span class="flag flag-cn"></span>繁體中文</a></li>
                        <li><a href="#"><span class="flag flag-tw"></span>简体中文</a></li>
                        <li><a href="#"><span class="flag flag-jp"></span>日本語</a></li>
                        <li><a href="#"><span class="flag flag-th"></span>ภาษาไทย</a></li>
                        <li><a href="#"><span class="flag flag-kr"></span>한국어</a></li>
                        <li><a href="#"><span class="flag flag-vn"></span>Tiếng Việt</a></li>
                    </ul>
                </div>
            </div>
            <div class="rowlg">
                <input type="text" class="txt" placeholder="Username">
                <i class="icon-user"></i>
            </div>
            <div class="rowlg">
                <input type="password" class="txt" placeholder="Password">
                <i class="icon-lock"></i>
            </div>
            <div class="rowlg checkbox">
                <label>
                    <input name="chb-showpass" type="checkbox" value="0" checked />Show password
                </label>
            </div>
            <div class="rowlg">
                <input type="button" class="btnLogin" value="Login">
            </div>
        </form>
    </div>
</div>
