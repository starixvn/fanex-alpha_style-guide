<div ng-controller="sgDemoNexDatePicker">
    <form class="form-inline filter demo-nexdatepicker" role="form" id="filter">
        <div id="daterange-picker" class="form-group daterange-picker" data-currentdate="12/27/2016 3:41:49 PM" data-mindate="09/01/2016" data-maxdate="12/31/9999">
            <div class="ui_nexdatepicker_edit_field daterange-container">
                <select id="dropdown-daterange" name="UserSelectedDateRangeOption" class="dropdown-daterange hide">
                    <option value="0">Today</option>
                    <option value="1">Yesterday</option>
                    <option value="2">This Week</option>
                    <option value="3">Last Week</option>
                    <option value="4">This Month</option>
                    <option value="5">Last Month</option>
                    <option value="6">Since Last Month</option>
                    <option value="7">Specific Dates</option>
                </select>
            </div>

            <div id="from-date-container" class="input-group date ui_nexdatepicker_edit_field css fromdate">
                <input type="text" id="from-date" name="FromDate" readonly="readonly" class="ui_nexdatepicker_datetextbox ui_nexdatepicker_fromdate form-control" value="09/26/2016">
                <span class="input-group-addon">
                    <span class="icon-calendar"></span>
                </span>
            </div>
            <div class="ui_nexdatepicker_lbl_field separator">-</div>
            <div id="to-date-container" class="input-group date ui_nexdatepicker_edit_field  todate">
                <input type="text" id="to-date" name="ToDate" readonly="readonly" class="ui_nexdatepicker_datetextbox ui_nexdatepicker_todate form-control" value="12/27/2016">
                <span class="input-group-addon">
                    <span class="icon-calendar"></span>
                </span>
            </div>
        </div>
        <div class="form-group">
            <input type="button" value="Submit" class="btn btn-submit" />
        </div>
    </form>

</div>
